name: CI

on:
  push:
    branches: [ "main", "main_test" ]
  pull_request:
    branches: [ "main", "main_test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.23.2'

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Prepare Laravel runtime directories
      run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs

    - name: Install Dependencies (PHP)
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish

    - name: Audit PHP dependencies
      shell: bash
      run: |
        for attempt in 1 2 3; do
          status=0
          composer audit --locked || status=$?

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$status" -ne 100 ] || [ "$attempt" -eq 3 ]; then
            exit "$status"
          fi

          delay=$((attempt * 5))
          echo "Composer audit failed with exit code 100; retrying in ${delay} seconds."
          sleep "$delay"
        done

    - name: Syntax check (php -l)
      run: find app routes config database tests -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l

    - name: Install Dependencies (Node)
      run: npm ci

    - name: Audit production JavaScript dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Build Assets
      run: npm run build

    - name: Generate CI application key
      shell: bash
      run: echo "APP_KEY=base64:$(php -r 'echo base64_encode(random_bytes(32));')" >> "$GITHUB_ENV"

    - name: Run Migrations
      run: php artisan migrate:fresh --env=testing
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Verify production caches
      run: |
        php artisan optimize
        php artisan optimize:clear
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Execute tests
      shell: bash
      run: |
        set +e
        php artisan test --colors=never --stop-on-error 2>&1 | tee "$RUNNER_TEMP/phpunit-output.log"
        status=${PIPESTATUS[0]}
        set -e

        if [ "$status" -ne 0 ]; then
          details="$(tail -n 80 "$RUNNER_TEMP/phpunit-output.log")"
          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=PHPUnit failed with exit code ${status}::${details}"
        fi

        exit "$status"
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: root
