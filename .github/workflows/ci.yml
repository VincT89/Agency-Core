name: CI

on:
  push:
    branches: [ "main", "main_test" ]
  pull_request:
    branches: [ "main", "main_test" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, redis
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies (PHP)
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Validate Composer metadata
      run: composer validate --strict --no-check-publish

    - name: Audit PHP dependencies
      run: composer audit --locked

    - name: Syntax check (php -l)
      run: find app routes config database tests -name '*.php' -print0 | xargs -0 -n 1 -P 4 php -l

    - name: Install Dependencies (Node)
      run: npm ci

    - name: Audit production JavaScript dependencies
      run: npm audit --omit=dev --audit-level=high

    - name: Build Assets
      run: npm run build

    - name: Generate key
      run: php artisan key:generate --env=testing

    - name: Run Migrations
      run: php artisan migrate:fresh --env=testing
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Verify production caches
      run: php artisan optimize
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: root

    - name: Execute tests
      run: php artisan test
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: testing
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_USERNAME: root
        DB_PASSWORD: root
